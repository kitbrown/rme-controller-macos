name: Validate Stream Deck Plugin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "com.fionetworks.rme-globalosc.sdPlugin/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run automated tests
        run: npm test
      - name: Install Stream Deck CLI
        run: npm install --global @elgato/cli@latest
      - name: Validate plugin
        run: streamdeck validate com.fionetworks.rme-globalosc.sdPlugin
