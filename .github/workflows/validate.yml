name: Validate Stream Deck Plugin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'com.chris.rme-globalosc.sdPlugin/**'
      - 'package.json'
      - 'package-lock.json'
      - 'rollup.config.mjs'
      - 'tsconfig.json'
      - '.github/workflows/validate.yml'

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Install Stream Deck CLI
        run: npm install -g @elgato/cli@latest
      - name: Validate plugin
        run: streamdeck validate com.chris.rme-globalosc.sdPlugin
