name: Validate Stream Deck Plugin

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, marketplace/v1.1.9-submission]

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run runtime regressions
        run: npm test
      - name: Verify shipped source and retained artifacts without rebuilding
        run: python3 tools/verify-shipped-release.py
      - name: Check profile contracts without regenerating profiles
        run: |
          python3 test/starter-profiles-test.py StarterProfiles.test_preserved_runtime_and_action_contracts
          python3 test/starter-profiles-test.py StarterProfiles.test_new_icons_match_validated_ci_build
          python3 test/starter-profiles-test.py StarterProfiles.test_all_profiles_resolve_fit_and_preserve_control_settings
      - name: Compare every candidate package member with this checkout
        run: python3 tools/verify-candidate.py
