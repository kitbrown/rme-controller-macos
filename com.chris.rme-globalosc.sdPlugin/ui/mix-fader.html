<!doctype html><html><head><meta charset='utf-8'><style>body{font-family:-apple-system;color:#ddd;background:#2d2d2d;margin:12px}label{display:block;margin:10px 0 3px}input,select{width:100%;box-sizing:border-box;background:#444;color:#fff;border:1px solid #666;padding:6px;border-radius:4px}.note{font-size:11px;color:#aaa;margin-top:12px}</style></head><body><label>Host</label><input type='text' data-setting='host' value='127.0.0.1'><label>TotalMix receive port</label><input type='number' data-setting='sendPort' value='7008'><label>Plugin receive port</label><input type='number' data-setting='receivePort' value='9008'><label>Source bus</label><select data-setting='bus'><option value='in'>Input</option><option value='playback'>Playback</option></select><label>Source index (zero-based)</label><input type='number' data-setting='sourceIndex' value='0'><label>Output/submix index (zero-based)</label><input type='number' data-setting='outputIndex' value='0'><label>Step (dB/tick)</label><input type='number' data-setting='stepDb' value='0.5'><div class='note'>Global OSC defaults: TotalMix receives on 7008; plugin receives on 9008.</div><script src='common.js'></script></body></html>
