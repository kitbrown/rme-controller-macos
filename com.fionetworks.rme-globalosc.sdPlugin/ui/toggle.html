<!doctype html><html><head><meta charset='utf-8'><style>body{font:13px -apple-system;color:#ddd;background:#2b2b2b;margin:12px}label{display:block;margin:10px 0 4px}input,select{width:100%;box-sizing:border-box;padding:7px;background:#444;color:#fff;border:1px solid #666;border-radius:4px}.note{margin-top:12px;font-size:11px;color:#aaa}[hidden]{display:none}</style></head><body><label>Preset</label><select data-setting='preset'><option value='mainMute'>Main Mute</option><option value='dim'>Dim</option><option value='mic48v'>Analog 1/2 — 48V</option><option value='phonesMute'>Phones 1 Mute</option><option value='micMute'>Analog 1/2 — Mute</option><option value='talkback'>Talkback + Dim</option><option value='custom'>Custom Global OSC toggle</option></select><div data-show-preset='custom'><label>Key title</label><input type='text' data-setting='title' value='Toggle'><label>OSC path</label><input type='text' data-setting='path' value='/controlroom/dim'></div><label>Host</label><input type='text' data-setting='host' value='127.0.0.1'><label>TotalMix receive port</label><input type='number' data-setting='sendPort' value='7008'><label>Plugin receive port</label><input type='number' data-setting='receivePort' value='9008'><div class='note'>A press enables the selected function; the next press disables it. State always follows TotalMix feedback.</div><script src='common.js'></script></body></html>
