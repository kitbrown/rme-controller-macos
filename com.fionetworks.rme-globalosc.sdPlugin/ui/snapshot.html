<!doctype html><html><head><meta charset="utf-8"><style>
:root{color-scheme:dark;--panel:#121922;--line:#263341;--text:#edf4fb;--muted:#8fa1b2;--accent:#c88cff}
*{box-sizing:border-box}body{margin:0;padding:14px;font:13px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;color:var(--text);background:linear-gradient(180deg,#0b0f14,#0e141b)}
.hero{padding:14px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(145deg,#15101b,#0d131a);margin-bottom:12px}.kicker{font-size:10px;letter-spacing:.16em;color:var(--accent);font-weight:700}.title{font-size:18px;font-weight:700;margin-top:3px}.sub{font-size:11px;color:var(--muted);margin-top:4px}.badge{display:inline-block;margin-top:8px;padding:3px 7px;border:1px solid #5b3e68;border-radius:999px;color:#e4bfff;background:#211629;font-size:10px}
.section{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:10px 0}.section h3{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:#cbb9d8}
label{display:block;margin:9px 0 4px;color:#cbd6e1}input,select{width:100%;padding:8px 9px;border:1px solid #354657;border-radius:7px;background:#0d141c;color:#fff;outline:none}input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 2px #c88cff22}.note{margin-top:10px;padding:9px 10px;border-left:3px solid var(--accent);background:#16111b;color:var(--muted);border-radius:6px;font-size:11px;line-height:1.4}
</style></head><body>
<div class="hero"><div class="kicker">FIO • RME GLOBAL OSC</div><div class="title">Snapshot</div><div class="sub">Recall and track TotalMix mixer states.</div><span class="badge">MIXER MEMORY</span></div>
<div class="section"><h3>Recall</h3><label>Snapshot</label><select data-setting="snapshot"><option value="1">Snapshot 1</option><option value="2">Snapshot 2</option><option value="3">Snapshot 3</option><option value="4">Snapshot 4</option><option value="5">Snapshot 5</option><option value="6">Snapshot 6</option><option value="7">Snapshot 7</option><option value="8">Snapshot 8</option></select></div>
<div class="section"><h3>OSC</h3><label>Host</label><input type="text" data-setting="host" value="127.0.0.1"><label>TotalMix receive port</label><input type="number" data-setting="sendPort" value="7008"><label>Plugin receive port</label><input type="number" data-setting="receivePort" value="9008"></div>
<div class="note">Active and changed snapshot state follows TotalMix feedback. The purple accent keeps mixer-memory actions visually distinct from live level controls.</div><script src="common.js"></script></body></html>
