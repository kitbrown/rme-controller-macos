<!doctype html><html><head><meta charset='utf-8'><style>body{font:13px -apple-system;color:#ddd;background:#2b2b2b;margin:12px}label{display:block;margin:10px 0 4px}input:not([type=checkbox]),select{width:100%;box-sizing:border-box;padding:7px;background:#444;color:#fff;border:1px solid #666;border-radius:4px}.check{display:flex;gap:8px;align-items:center}.note{margin-top:12px;font-size:11px;color:#aaa}[hidden]{display:none}</style></head><body><label>Preset</label><select data-setting='preset'><option value='main'>Control Room — Main</option><option value='phones1'>Control Room — Phones 1</option><option value='custom'>Custom output</option></select><div data-show-preset='custom'><label>Screen label</label><input type='text' data-setting='label' value='Output'><label>Output index (zero-based)</label><input type='number' data-setting='outputIndex' value='0'></div><label>Host</label><input type='text' data-setting='host' value='127.0.0.1'><label>TotalMix receive port</label><input type='number' data-setting='sendPort' value='7008'><label>Plugin receive port</label><input type='number' data-setting='receivePort' value='9008'><label>dB per tick</label><input type='number' data-setting='stepDb' value='0.5' step='0.1'><label>Minimum dB</label><input type='number' data-setting='minDb' value='-65' step='0.1'><label>Maximum dB</label><input type='number' data-setting='maxDb' value='6' step='0.1'><label class='check'><input type='checkbox' data-setting='muteOnPress' checked>Dial press mutes/unmutes</label><div class='note'>Turn is blocked while muted. Defaults use RME Global OSC ports 7008/9008.</div><script src='common.js'></script></body></html>
